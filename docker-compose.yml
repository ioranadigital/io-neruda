version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - LOG_LEVEL=info
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.io-neruda.rule=Host(`neruda.iorana.dev`,`www.neruda.iorana.dev`)"
      - "traefik.http.routers.io-neruda.entrypoints=websecure"
      - "traefik.http.routers.io-neruda.tls.certresolver=letsencrypt"
      - "traefik.http.services.io-neruda-service.loadbalancer.server.port=3003"

networks:
  coolify:
    external: true
  default:
    driver: bridge
