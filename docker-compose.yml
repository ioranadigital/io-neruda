version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=production
      - IO_NERUDA_ENV=production
      - IO_NERUDA_BACKEND_PORT=4005
      - LOG_LEVEL=info
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - coolify
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://168.119.53.118:4005/api}
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.io-neruda.rule=Host(`neruda.iorana.dev`,`www.neruda.iorana.dev`)"
      - "traefik.http.routers.io-neruda.entrypoints=websecure"
      - "traefik.http.routers.io-neruda.tls.certresolver=letsencrypt"
      - "traefik.http.services.io-neruda-service.loadbalancer.server.port=3003"

networks:
  coolify:
    external: true
  default:
    driver: bridge
